<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Arabic PDF Reader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col justify-between select-none font-sans">

  <!-- Header -->
  <header class="p-3 bg-gray-900 border-b border-gray-800 flex items-center justify-between gap-2">
    <h1 class="text-base font-bold text-emerald-400 flex items-center gap-1">🎧 Web Audible (Free)</h1>
    
    <label class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-xs font-semibold cursor-pointer transition">
      📁 Open File (PDF / TXT)
      <input type="file" id="file-input" accept=".pdf,.txt" class="hidden">
    </label>
  </header>

  <!-- Hidden Canvas for PDF rendering -->
  <canvas id="pdf-canvas" class="hidden"></canvas>

  <!-- Text Display -->
  <main id="reader-container" class="flex-1 overflow-y-auto p-6 max-w-3xl mx-auto w-full leading-loose text-xl font-serif text-right">
    <div id="placeholder" class="h-full flex flex-col items-center justify-center text-gray-500 text-center space-y-2">
      <p class="text-xl">لا يوجد كتاب محمل</p>
      <p class="text-xs text-gray-600">اختر ملف PDF أو TXT للبدء مجاناً.</p>
    </div>
    <div id="status-msg" class="hidden text-center text-emerald-400 font-sans text-sm my-2"></div>
    <div id="text-content" class="hidden space-y-4"></div>
  </main>

  <!-- Bottom Controls -->
  <footer class="bg-gray-900 border-t border-gray-800 p-4 flex flex-col gap-3 max-w-3xl mx-auto w-full" dir="ltr">
    <div class="flex items-center gap-3 text-xs text-gray-400 font-mono">
      <span id="current-pos">0%</span>
      <div class="flex-1 bg-gray-800 h-2 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-200"></div>
      </div>
      <span id="speed-display">1.0x</span>
    </div>

    <div class="flex items-center justify-between px-6">
      <select id="speed-select" class="bg-gray-800 text-xs border border-gray-700 rounded px-2 py-1 text-gray-300">
        <option value="0.75">0.75x</option>
        <option value="1.0" selected>1.0x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
      </select>

      <div class="flex items-center gap-6">
        <button id="skip-back" class="p-2 text-gray-400 hover:text-white text-xl active:scale-95 transition">↺ 15s</button>
        <button id="play-btn" class="w-14 h-14 bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-bold rounded-full flex items-center justify-center text-2xl shadow-lg active:scale-95 transition">
          ▶
        </button>
        <button id="skip-forward" class="p-2 text-gray-400 hover:text-white text-xl active:scale-95 transition">15s ↻</button>
      </div>

      <select id="voice-select" class="bg-gray-800 text-xs border border-gray-700 rounded px-2 py-1 text-gray-300 max-w-[120px] truncate"></select>
    </div>
  </footer>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let sentences = [];
    let currentIndex = 0;
    let isPlaying = false;
    let synth = window.speechSynthesis;
    let currentUtterance = null;
    const canvas = document.getElementById('pdf-canvas');

    const fileInput = document.getElementById('file-input');
    const textContainer = document.getElementById('text-content');
    const placeholder = document.getElementById('placeholder');
    const statusMsg = document.getElementById('status-msg');
    const playBtn = document.getElementById('play-btn');
    const progressBar = document.getElementById('progress-bar');
    const currentPos = document.getElementById('current-pos');
    const speedSelect = document.getElementById('speed-select');
    const voiceSelect = document.getElementById('voice-select');

    function loadVoices() {
      const voices = synth.getVoices();
      voiceSelect.innerHTML = '';
      const arVoices = voices.filter(v => v.lang.startsWith('ar'));
      const list = arVoices.length > 0 ? arVoices : voices;

      list.forEach((v) => {
        const opt = document.createElement('option');
        opt.value = v.name;
        opt.textContent = `${v.name} (${v.lang})`;
        voiceSelect.appendChild(opt);
      });
    }

    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      stopSpeech();
      statusMsg.classList.remove('hidden');

      let fullText = "";

      if (file.name.endsWith('.pdf')) {
        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          
          statusMsg.textContent = "جاري تحضير محرك التعرف المجاني على النصوص...";
          const worker = await Tesseract.createWorker('ara');

          const pagesToRead = Math.min(pdf.numPages, 5); // Read up to 5 pages
          for (let i = 1; i <= pagesToRead; i++) {
            statusMsg.textContent = `جاري استخراج النص العربي مجاناً (صفحة ${i} من ${pagesToRead})...`;
            const page = await pdf.getPage(i);
            const viewport = page.getViewport({ scale: 1.5 });
            
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            const ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport: viewport }).promise;

            const ret = await worker.recognize(canvas);
            fullText += ret.data.text + "\n";
          }

          await worker.terminate();
        } catch (err) {
          alert('Error extracting Arabic text: ' + err.message);
        }
      } else {
        fullText = await file.text();
      }

      statusMsg.classList.add('hidden');
      processText(fullText);
    });

    function processText(text) {
      const cleaned = text.replace(/\s+/g, ' ').trim();
      sentences = cleaned.split(/(?<=[.!?؟\n])\s+/).filter(s => s.trim().length > 0);
      if (!sentences.length) sentences = [cleaned];

      currentIndex = 0;
      placeholder.classList.add('hidden');
      textContainer.classList.remove('hidden');

      textContainer.innerHTML = sentences.map((s, idx) => 
        `<span id="s-${idx}" class="p-1 rounded cursor-pointer hover:bg-gray-800 transition inline-block my-0.5">${s}</span>`
      ).join(' ');

      sentences.forEach((_, idx) => {
        document.getElementById(`s-${idx}`).onclick = () => {
          currentIndex = idx;
          if (isPlaying) speakCurrentSentence();
          else updateHighlight();
        };
      });

      updateProgress();
    }

    function speakCurrentSentence() {
      synth.cancel();
      if (currentIndex >= sentences.length) {
        isPlaying = false;
        playBtn.textContent = '▶';
        return;
      }

      updateHighlight();

      const text = sentences[currentIndex];
      currentUtterance = new SpeechSynthesisUtterance(text);
      currentUtterance.lang = 'ar-SA';
      currentUtterance.rate = parseFloat(speedSelect.value);

      const voices = synth.getVoices();
      const selectedVoice = voices.find(v => v.name === voiceSelect.value);
      if (selectedVoice) {
        currentUtterance.voice = selectedVoice;
      }

      currentUtterance.onend = () => {
        if (isPlaying) {
          currentIndex++;
          speakCurrentSentence();
        }
      };

      currentUtterance.onerror = () => {
        if (isPlaying) {
          currentIndex++;
          speakCurrentSentence();
        }
      };

      synth.speak(currentUtterance);
    }

    function updateHighlight() {
      document.querySelectorAll('.bg-emerald-900').forEach(el => {
        el.classList.remove('bg-emerald-900', 'text-emerald-200');
      });
      const el = document.getElementById(`s-${currentIndex}`);
      if (el) {
        el.classList.add('bg-emerald-900', 'text-emerald-200');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      updateProgress();
    }

    function updateProgress() {
      if (!sentences.length) return;
      const pct = Math.round((currentIndex / sentences.length) * 100);
      progressBar.style.width = `${pct}%`;
      currentPos.textContent = `${pct}%`;
    }

    function stopSpeech() {
      isPlaying = false;
      synth.cancel();
      playBtn.textContent = '▶';
    }

    playBtn.onclick = () => {
      if (!sentences.length) return;
      if (isPlaying) {
        isPlaying = false;
        synth.pause();
        playBtn.textContent = '▶';
      } else {
        isPlaying = true;
        playBtn.textContent = '⏸';
        if (synth.paused) {
          synth.resume();
        } else {
          speakCurrentSentence();
        }
      }
    };

    document.getElementById('skip-forward').onclick = () => {
      currentIndex = Math.min(sentences.length - 1, currentIndex + 2);
      if (isPlaying) speakCurrentSentence();
      else updateHighlight();
    };

    document.getElementById('skip-back').onclick = () => {
      currentIndex = Math.max(0, currentIndex - 2);
      if (isPlaying) speakCurrentSentence();
      else updateHighlight();
    };

    speedSelect.onchange = () => {
      document.getElementById('speed-display').textContent = `${speedSelect.value}x`;
      if (isPlaying) speakCurrentSentence();
    };
  </script>
</body>
</html>
