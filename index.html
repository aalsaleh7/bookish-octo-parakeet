<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Language Audiobook Reader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col justify-between select-none font-sans">

  <!-- Header / Upload & Language -->
  <header class="p-3 bg-gray-900 border-b border-gray-800 flex items-center justify-between gap-2 flex-wrap">
    <div class="flex items-center gap-3">
      <h1 class="text-base font-bold text-emerald-400 flex items-center gap-1">🎧 Web Audible</h1>
      
      <!-- Language Picker -->
      <select id="lang-select" class="bg-gray-800 text-xs border border-gray-700 rounded px-2.5 py-1.5 text-gray-200 font-semibold focus:outline-none focus:border-emerald-500">
        <option value="ar" selected>🇸🇦 العربية (Arabic)</option>
        <option value="en">🇺🇸 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="de">🇩🇪 Deutsch</option>
      </select>
    </div>

    <label class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-xs font-semibold cursor-pointer transition">
      📁 Open File (PDF / TXT)
      <input type="file" id="file-input" accept=".pdf,.txt" class="hidden">
    </label>
  </header>

  <!-- Text Display / Reader -->
  <main id="reader-container" class="flex-1 overflow-y-auto p-6 max-w-3xl mx-auto w-full leading-loose text-xl font-serif text-right">
    <div id="placeholder" class="h-full flex flex-col items-center justify-center text-gray-500 text-center space-y-2">
      <p class="text-xl">No book loaded / لا يوجد كتاب محمل</p>
      <p class="text-xs text-gray-600">Select a PDF or TXT file to begin listening.</p>
    </div>
    <div id="text-content" class="hidden space-y-4"></div>
  </main>

  <!-- Audible Bottom Controls -->
  <footer class="bg-gray-900 border-t border-gray-800 p-4 flex flex-col gap-3 max-w-3xl mx-auto w-full" dir="ltr">
    <!-- Progress Bar -->
    <div class="flex items-center gap-3 text-xs text-gray-400 font-mono">
      <span id="current-pos">0%</span>
      <div class="flex-1 bg-gray-800 h-2 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-200"></div>
      </div>
      <span id="speed-display">1.0x</span>
    </div>

    <!-- Media Buttons -->
    <div class="flex items-center justify-between px-6">
      <!-- Speed Selector -->
      <select id="speed-select" class="bg-gray-800 text-xs border border-gray-700 rounded px-2 py-1 text-gray-300">
        <option value="0.75">0.75x</option>
        <option value="1.0" selected>1.0x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2.0">2.0x</option>
      </select>

      <div class="flex items-center gap-6">
        <!-- Skip Back 15s -->
        <button id="skip-back" class="p-2 text-gray-400 hover:text-white text-xl active:scale-95 transition">↺ 15s</button>
        
        <!-- Play / Pause -->
        <button id="play-btn" class="w-14 h-14 bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-bold rounded-full flex items-center justify-center text-2xl shadow-lg active:scale-95 transition">
          ▶
        </button>
        
        <!-- Skip Forward 15s -->
        <button id="skip-forward" class="p-2 text-gray-400 hover:text-white text-xl active:scale-95 transition">15s ↻</button>
      </div>

      <!-- Voice Selector -->
      <select id="voice-select" class="bg-gray-800 text-xs border border-gray-700 rounded px-2 py-1 text-gray-300 max-w-[120px] truncate"></select>
    </div>
  </footer>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let sentences = [];
    let currentIndex = 0;
    let isPlaying = false;
    let synth = window.speechSynthesis;
    let currentUtterance = null;

    const fileInput = document.getElementById('file-input');
    const textContainer = document.getElementById('text-content');
    const readerContainer = document.getElementById('reader-container');
    const placeholder = document.getElementById('placeholder');
    const playBtn = document.getElementById('play-btn');
    const progressBar = document.getElementById('progress-bar');
    const currentPos = document.getElementById('current-pos');
    const speedSelect = document.getElementById('speed-select');
    const voiceSelect = document.getElementById('voice-select');
    const langSelect = document.getElementById('lang-select');
    const htmlRoot = document.getElementById('html-root');

    // Filter Voices based on selected language code
    function filterVoicesForSelectedLang() {
      const voices = synth.getVoices();
      voiceSelect.innerHTML = '';
      
      const selectedLangPrefix = langSelect.value;
      const matchingVoices = voices.filter(v => v.lang.toLowerCase().startsWith(selectedLangPrefix));
      const voiceList = matchingVoices.length > 0 ? matchingVoices : voices;

      voiceList.forEach((v) => {
        const opt = document.createElement('option');
        opt.value = v.name;
        opt.textContent = `${v.name} (${v.lang})`;
        voiceSelect.appendChild(opt);
      });
    }

    // Handle Language Mode Switch
    langSelect.onchange = () => {
      const selectedLang = langSelect.value;
      
      // Toggle RTL vs LTR alignment dynamically
      if (selectedLang === 'ar') {
        htmlRoot.setAttribute('dir', 'rtl');
        htmlRoot.setAttribute('lang', 'ar');
        readerContainer.classList.remove('text-left');
        readerContainer.classList.add('text-right');
      } else {
        htmlRoot.setAttribute('dir', 'ltr');
        htmlRoot.setAttribute('lang', selectedLang);
        readerContainer.classList.remove('text-right');
        readerContainer.classList.add('text-left');
      }

      filterVoicesForSelectedLang();
      if (isPlaying) speakCurrentSentence();
    };

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = filterVoicesForSelectedLang;
    }

    // Load File
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      stopSpeech();
      let fullText = "";

      if (file.name.endsWith('.pdf')) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          fullText += content.items.map(item => item.str).join(' ') + ' ';
        }
      } else {
        fullText = await file.text();
      }

      processText(fullText);
    });

    // Segment text
    function processText(text) {
      const cleanedText = text.replace(/\s+/g, ' ').trim();
      sentences = cleanedText.match(/[^.!?؟\n]+[.!?؟\n]+/g) || [cleanedText];
      currentIndex = 0;

      placeholder.classList.add('hidden');
      textContainer.classList.remove('hidden');
      textContainer.innerHTML = sentences.map((s, idx) => 
        `<span id="s-${idx}" class="p-1 rounded cursor-pointer hover:bg-gray-800 transition inline-block">${s}</span>`
      ).join(' ');

      sentences.forEach((_, idx) => {
        document.getElementById(`s-${idx}`).onclick = () => {
          currentIndex = idx;
          if (isPlaying) speakCurrentSentence();
          else updateHighlight();
        };
      });

      updateProgress();
    }

    // Speech Control
    function speakCurrentSentence() {
      synth.cancel();
      if (currentIndex >= sentences.length) {
        isPlaying = false;
        playBtn.textContent = '▶';
        return;
      }

      updateHighlight();

      const text = sentences[currentIndex];
      currentUtterance = new SpeechSynthesisUtterance(text);
      
      // Set language tag according to dropdown
      currentUtterance.lang = langSelect.value;
      currentUtterance.rate = parseFloat(speedSelect.value);

      const voices = synth.getVoices();
      const selectedVoice = voices.find(v => v.name === voiceSelect.value);
      if (selectedVoice) {
        currentUtterance.voice = selectedVoice;
      }

      currentUtterance.onend = () => {
        if (isPlaying) {
          currentIndex++;
          speakCurrentSentence();
        }
      };

      currentUtterance.onerror = () => {
        if (isPlaying) {
          currentIndex++;
          speakCurrentSentence();
        }
      };

      synth.speak(currentUtterance);
    }

    function updateHighlight() {
      document.querySelectorAll('.bg-emerald-900').forEach(el => {
        el.classList.remove('bg-emerald-900', 'text-emerald-200');
      });
      const el = document.getElementById(`s-${currentIndex}`);
      if (el) {
        el.classList.add('bg-emerald-900', 'text-emerald-200');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      updateProgress();
    }

    function updateProgress() {
      if (!sentences.length) return;
      const pct = Math.round((currentIndex / sentences.length) * 100);
      progressBar.style.width = `${pct}%`;
      currentPos.textContent = `${pct}%`;
    }

    function stopSpeech() {
      isPlaying = false;
      synth.cancel();
      playBtn.textContent = '▶';
    }

    // Controls
    playBtn.onclick = () => {
      if (!sentences.length) return;
      if (isPlaying) {
        isPlaying = false;
        synth.pause();
        playBtn.textContent = '▶';
      } else {
        isPlaying = true;
        playBtn.textContent = '⏸';
        if (synth.paused) {
          synth.resume();
        } else {
          speakCurrentSentence();
        }
      }
    };

    document.getElementById('skip-forward').onclick = () => {
      currentIndex = Math.min(sentences.length - 1, currentIndex + 2);
      if (isPlaying) speakCurrentSentence();
      else updateHighlight();
    };

    document.getElementById('skip-back').onclick = () => {
      currentIndex = Math.max(0, currentIndex - 2);
      if (isPlaying) speakCurrentSentence();
      else updateHighlight();
    };

    speedSelect.onchange = () => {
      document.getElementById('speed-display').textContent = `${speedSelect.value}x`;
      if (isPlaying) speakCurrentSentence();
    };

    window.addEventListener('DOMContentLoaded', filterVoicesForSelectedLang);
  </script>
</body>
</html>
