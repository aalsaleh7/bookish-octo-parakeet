<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audiobook Reader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col justify-between select-none font-sans">

  <!-- Header / Upload -->
  <header class="p-4 bg-gray-900 border-b border-gray-800 flex items-center justify-between">
    <h1 class="text-lg font-bold text-emerald-400 flex items-center gap-2">🎧 Web Audible</h1>
    <label class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-xs font-semibold cursor-pointer transition">
      📁 Open File (PDF / TXT)
      <input type="file" id="file-input" accept=".pdf,.txt" class="hidden">
    </label>
  </header>

  <!-- Text Display / Reader -->
  <main id="reader-container" class="flex-1 overflow-y-auto p-6 max-w-3xl mx-auto w-full leading-relaxed text-lg font-serif">
    <div id="placeholder" class="h-full flex flex-col items-center justify-center text-gray-500 text-center space-y-2">
      <p class="text-xl">No book loaded</p>
      <p class="text-xs text-gray-600">Select a PDF or TXT file to begin listening.</p>
    </div>
    <div id="text-content" class="hidden space-y-4"></div>
  </main>

  <!-- Audible Bottom Controls -->
  <footer class="bg-gray-900 border-t border-gray-800 p-4 flex flex-col gap-3 max-w-3xl mx-auto w-full">
    <!-- Progress Bar -->
    <div class="flex items-center gap-3 text-xs text-gray-400 font-mono">
      <span id="current-pos">0%</span>
      <div class="flex-1 bg-gray-800 h-2 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-200"></div>
      </div>
      <span id="speed-display">1.0x</span>
    </div>

    <!-- Media Buttons -->
    <div class="flex items-center justify-between px-6">
      <!-- Speed Selector -->
      <select id="speed-select" class="bg-gray-800 text-xs border border-gray-700 rounded px-2 py-1 text-gray-300">
        <option value="0.75">0.75x</option>
        <option value="1.0" selected>1.0x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2.0">2.0x</option>
      </select>

      <div class="flex items-center gap-6">
        <!-- Skip Back 15s -->
        <button id="skip-back" class="p-2 text-gray-400 hover:text-white text-xl active:scale-95 transition">↺ 15s</button>
        
        <!-- Play / Pause -->
        <button id="play-btn" class="w-14 h-14 bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-bold rounded-full flex items-center justify-center text-2xl shadow-lg active:scale-95 transition">
          ▶
        </button>
        
        <!-- Skip Forward 15s -->
        <button id="skip-forward" class="p-2 text-gray-400 hover:text-white text-xl active:scale-95 transition">15s ↻</button>
      </div>

      <!-- Voice Selector -->
      <select id="voice-select" class="bg-gray-800 text-xs border border-gray-700 rounded px-2 py-1 text-gray-300 max-w-[100px] truncate"></select>
    </div>
  </footer>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let sentences = [];
    let currentIndex = 0;
    let isPlaying = false;
    let synth = window.speechSynthesis;
    let currentUtterance = null;

    const fileInput = document.getElementById('file-input');
    const textContainer = document.getElementById('text-content');
    const placeholder = document.getElementById('placeholder');
    const playBtn = document.getElementById('play-btn');
    const progressBar = document.getElementById('progress-bar');
    const currentPos = document.getElementById('current-pos');
    const speedSelect = document.getElementById('speed-select');
    const voiceSelect = document.getElementById('voice-select');

    // Populate System Voices
    function loadVoices() {
      const voices = synth.getVoices();
      voiceSelect.innerHTML = '';
      voices.forEach((v, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${v.name} (${v.lang})`;
        if (v.default) opt.selected = true;
        voiceSelect.appendChild(opt);
      });
    }
    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    // Load File Handler
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      stopSpeech();
      let fullText = "";

      if (file.name.endsWith('.pdf')) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          fullText += content.items.map(item => item.str).join(' ') + ' ';
        }
      } else {
        fullText = await file.text();
      }

      processText(fullText);
    });

    // Segment text into readable sentences
    function processText(text) {
      sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
      currentIndex = 0;

      placeholder.classList.add('hidden');
      textContainer.classList.remove('hidden');
      textContainer.innerHTML = sentences.map((s, idx) => 
        `<span id="s-${idx}" class="p-1 rounded cursor-pointer hover:bg-gray-800 transition">${s}</span>`
      ).join(' ');

      // Allow clicking any sentence to read from there
      sentences.forEach((_, idx) => {
        document.getElementById(`s-${idx}`).onclick = () => {
          currentIndex = idx;
          if (isPlaying) speakCurrentSentence();
          else updateHighlight();
        };
      });

      updateProgress();
    }

    // Speech Control Logic
    function speakCurrentSentence() {
      synth.cancel();
      if (currentIndex >= sentences.length) {
        isPlaying = false;
        playBtn.textContent = '▶';
        return;
      }

      updateHighlight();

      const text = sentences[currentIndex];
      currentUtterance = new SpeechSynthesisUtterance(text);
      currentUtterance.rate = parseFloat(speedSelect.value);

      const voices = synth.getVoices();
      if (voices[voiceSelect.value]) {
        currentUtterance.voice = voices[voiceSelect.value];
      }

      currentUtterance.onend = () => {
        if (isPlaying) {
          currentIndex++;
          speakCurrentSentence();
        }
      };

      currentUtterance.onerror = () => {
        if (isPlaying) {
          currentIndex++;
          speakCurrentSentence();
        }
      };

      synth.speak(currentUtterance);
    }

    function updateHighlight() {
      document.querySelectorAll('.bg-emerald-900').forEach(el => {
        el.classList.remove('bg-emerald-900', 'text-emerald-200');
      });
      const el = document.getElementById(`s-${currentIndex}`);
      if (el) {
        el.classList.add('bg-emerald-900', 'text-emerald-200');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      updateProgress();
    }

    function updateProgress() {
      if (!sentences.length) return;
      const pct = Math.round((currentIndex / sentences.length) * 100);
      progressBar.style.width = `${pct}%`;
      currentPos.textContent = `${pct}%`;
    }

    function stopSpeech() {
      isPlaying = false;
      synth.cancel();
      playBtn.textContent = '▶';
    }

    // Playback Event Listeners
    playBtn.onclick = () => {
      if (!sentences.length) return;
      if (isPlaying) {
        isPlaying = false;
        synth.pause();
        playBtn.textContent = '▶';
      } else {
        isPlaying = true;
        playBtn.textContent = '⏸';
        if (synth.paused) {
          synth.resume();
        } else {
          speakCurrentSentence();
        }
      }
    };

    document.getElementById('skip-forward').onclick = () => {
      currentIndex = Math.min(sentences.length - 1, currentIndex + 3);
      if (isPlaying) speakCurrentSentence();
      else updateHighlight();
    };

    document.getElementById('skip-back').onclick = () => {
      currentIndex = Math.max(0, currentIndex - 3);
      if (isPlaying) speakCurrentSentence();
      else updateHighlight();
    };

    speedSelect.onchange = () => {
      document.getElementById('speed-display').textContent = `${speedSelect.value}x`;
      if (isPlaying) speakCurrentSentence();
    };
  </script>
</body>
</html>
