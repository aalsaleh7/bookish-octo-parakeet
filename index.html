<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arabic Vision Audiobook</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col justify-between select-none font-sans">

  <!-- Header -->
  <header class="p-3 bg-gray-900 border-b border-gray-800 flex items-center justify-between gap-2">
    <h1 class="text-base font-bold text-emerald-400 flex items-center gap-1">🎧 Web Audible (Vision OCR)</h1>
    
    <div class="flex items-center gap-2">
      <button id="key-btn" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg text-xs text-amber-400 font-semibold transition">
        🔑 API Key
      </button>

      <label class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-xs font-semibold cursor-pointer transition">
        📁 Open PDF
        <input type="file" id="file-input" accept=".pdf" class="hidden">
      </label>
    </div>
  </header>

  <!-- Hidden Canvas for PDF Page Rendering -->
  <canvas id="pdf-canvas" class="hidden"></canvas>

  <!-- Text Display -->
  <main id="reader-container" class="flex-1 overflow-y-auto p-6 max-w-3xl mx-auto w-full leading-loose text-xl font-serif text-right">
    <div id="placeholder" class="h-full flex flex-col items-center justify-center text-gray-500 text-center space-y-2">
      <p class="text-xl">لا يوجد كتاب محمل</p>
      <p class="text-xs text-gray-600">افتح ملف PDF لاستخلاصه بذكاء وقراءته بصوت طبيعي.</p>
    </div>
    <div id="status-msg" class="hidden text-center text-emerald-400 font-sans text-sm my-2 animate-pulse"></div>
    <div id="text-content" class="hidden space-y-4"></div>
  </main>

  <!-- Bottom Media Controls -->
  <footer class="bg-gray-900 border-t border-gray-800 p-4 flex flex-col gap-3 max-w-3xl mx-auto w-full" dir="ltr">
    <div class="flex items-center gap-3 text-xs text-gray-400 font-mono">
      <span id="current-pos">0%</span>
      <div class="flex-1 bg-gray-800 h-2 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-200"></div>
      </div>
      <span id="speed-display">1.0x</span>
    </div>

    <div class="flex items-center justify-between px-6">
      <select id="voice-select" class="bg-gray-800 text-xs border border-gray-700 rounded px-2 py-1 text-gray-300">
        <option value="onyx">Onyx (Deep)</option>
        <option value="alloy" selected>Alloy (Neutral)</option>
        <option value="echo">Echo (Male)</option>
        <option value="fable">Fable (Warm)</option>
        <option value="nova">Nova (Female)</option>
        <option value="shimmer">Shimmer (Clear)</option>
      </select>

      <div class="flex items-center gap-6">
        <button id="play-btn" class="w-14 h-14 bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-bold rounded-full flex items-center justify-center text-2xl shadow-lg active:scale-95 transition">
          ▶
        </button>
      </div>

      <select id="speed-select" class="bg-gray-800 text-xs border border-gray-700 rounded px-2 py-1 text-gray-300">
        <option value="0.75">0.75x</option>
        <option value="1.0" selected>1.0x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
      </select>
    </div>
  </footer>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let apiKey = localStorage.getItem('openai_key') || '';
    let sentences = [];
    let currentIndex = 0;
    let isPlaying = false;
    let audioPlayer = new Audio();

    const fileInput = document.getElementById('file-input');
    const textContainer = document.getElementById('text-content');
    const placeholder = document.getElementById('placeholder');
    const statusMsg = document.getElementById('status-msg');
    const playBtn = document.getElementById('play-btn');
    const progressBar = document.getElementById('progress-bar');
    const currentPos = document.getElementById('current-pos');
    const speedSelect = document.getElementById('speed-select');
    const voiceSelect = document.getElementById('voice-select');
    const keyBtn = document.getElementById('key-btn');
    const canvas = document.getElementById('pdf-canvas');

    keyBtn.onclick = () => {
      const input = prompt('Enter your OpenAI API Key (sk-...):', apiKey);
      if (input !== null) {
        apiKey = input.trim();
        localStorage.setItem('openai_key', apiKey);
        alert('API Key Saved!');
      }
    };

    fileInput.addEventListener('change', async (e) => {
      if (!apiKey) {
        alert('Please tap "API Key" and enter your OpenAI key first!');
        return;
      }
      const file = e.target.files[0];
      if (!file) return;

      stopAudio();
      statusMsg.textContent = "جاري قراءة الصفحة وتحليل النص العربي عبر الذكاء الاصطناعي...";
      statusMsg.classList.remove('hidden');

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        
        let extractedText = "";
        // Process up to first 3 pages to prevent token timeout
        const pagesToRead = Math.min(pdf.numPages, 3);

        for (let pageNum = 1; pageNum <= pagesToRead; pageNum++) {
          statusMsg.textContent = `جاري معالجة الصفحة ${pageNum} من ${pagesToRead}...`;
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.5 });
          
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          const ctx = canvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport: viewport }).promise;

          const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
          const pageText = await runVisionOCR(base64Image);
          extractedText += pageText + "\n";
        }

        statusMsg.classList.add('hidden');
        processExtractedText(extractedText);

      } catch (err) {
        alert('Error processing PDF: ' + err.message);
        statusMsg.classList.add('hidden');
      }
    });

    async function runVisionOCR(base64Image) {
      const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: [{
            role: "user",
            content: [
              { type: "text", text: "Extract all Arabic text from this document page cleanly. Fix broken letters, reconstruct right-to-left layout, remove headers/footers/page numbers, and keep exact Arabic punctuation. Output ONLY clean Arabic text." },
              { type: "image_url", image_url: { url: `data:image/jpeg;base64,${base64Image}` } }
            ]
          }]
        })
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      return data.choices[0].message.content;
    }

    function processExtractedText(text) {
      sentences = text.split(/(?<=[.!?؟\n])\s+/).filter(s => s.trim().length > 0);
      if (!sentences.length) sentences = [text];

      currentIndex = 0;
      placeholder.classList.add('hidden');
      textContainer.classList.remove('hidden');

      textContainer.innerHTML = sentences.map((s, idx) => 
        `<span id="s-${idx}" class="p-1 rounded cursor-pointer hover:bg-gray-800 transition inline-block my-0.5">${s}</span>`
      ).join(' ');

      sentences.forEach((_, idx) => {
        document.getElementById(`s-${idx}`).onclick = () => {
          currentIndex = idx;
          if (isPlaying) playCurrentSentence();
          else updateHighlight();
        };
      });

      updateProgress();
    }

    async function playCurrentSentence() {
      stopAudio();
      if (currentIndex >= sentences.length) {
        isPlaying = false;
        playBtn.textContent = '▶';
        return;
      }

      updateHighlight();
      const text = sentences[currentIndex];

      try {
        const response = await fetch('https://api.openai.com/v1/audio/speech', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'tts-1',
            input: text,
            voice: voiceSelect.value,
            speed: parseFloat(speedSelect.value)
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || `HTTP ${response.status}`);
        }

        const blob = await response.blob();
        audioPlayer.src = URL.createObjectURL(blob);
        audioPlayer.play();

        audioPlayer.onended = () => {
          if (isPlaying) {
            currentIndex++;
            playCurrentSentence();
          }
        };

      } catch (err) {
        alert(`Audio Speech Error: ${err.message}`);
        isPlaying = false;
        playBtn.textContent = '▶';
      }
    }

    function updateHighlight() {
      document.querySelectorAll('.bg-emerald-900').forEach(el => {
        el.classList.remove('bg-emerald-900', 'text-emerald-200');
      });
      const el = document.getElementById(`s-${currentIndex}`);
      if (el) {
        el.classList.add('bg-emerald-900', 'text-emerald-200');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      updateProgress();
    }

    function updateProgress() {
      if (!sentences.length) return;
      const pct = Math.round((currentIndex / sentences.length) * 100);
      progressBar.style.width = `${pct}%`;
      currentPos.textContent = `${pct}%`;
    }

    function stopAudio() {
      audioPlayer.pause();
      audioPlayer.currentTime = 0;
    }

    playBtn.onclick = () => {
      if (!sentences.length) return;
      if (isPlaying) {
        isPlaying = false;
        stopAudio();
        playBtn.textContent = '▶';
      } else {
        isPlaying = true;
        playBtn.textContent = '⏸';
        playCurrentSentence();
      }
    };

    speedSelect.onchange = () => {
      document.getElementById('speed-display').textContent = `${speedSelect.value}x`;
      if (isPlaying) playCurrentSentence();
    };
  </script>
</body>
</html>
