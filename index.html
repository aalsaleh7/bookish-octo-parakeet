<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0052cc">
  <link rel="manifest" href="manifest.json">
  <title>Mobile PDF Reader</title>
  
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg-color: #f4f5f7;
      --card-bg: #ffffff;
      --text-color: #172b4d;
      --primary: #0052cc;
      --border-color: #dfe1e6;
      --toolbar-bg: rgba(255, 255, 255, 0.95);
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --primary: #4c9aff;
      --border-color: #333333;
      --toolbar-bg: rgba(30, 30, 30, 0.95);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      user-select: none;
      overscroll-behavior-y: none;
    }

    /* Header with iPhone Notch / Dynamic Island Safe Area */
    header {
      background-color: var(--toolbar-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: max(12px, env(safe-area-inset-top)) 16px 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      min-height: 44px;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-secondary { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-color); }
    .btn-danger { background-color: #de350b; }

    /* Library View */
    #library-view {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .upload-box {
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      background: var(--card-bg);
      margin-bottom: 24px;
    }

    .book-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .book-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .book-info {
      flex: 1;
      margin-right: 12px;
    }

    .book-title {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .book-meta {
      font-size: 12px;
      opacity: 0.7;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    /* Reader View */
    #reader-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    #reader-toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--toolbar-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: max(8px, env(safe-area-inset-top)) 16px 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      transition: transform 0.25s ease;
    }

    #reader-toolbar.hidden {
      transform: translateY(-100%);
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }

    canvas {
      display: block;
      margin: auto;
      max-width: 100vw;
    }

    /* Dark Mode Filter on Canvas */
    body.dark-mode #pdf-canvas {
      filter: invert(0.88) hue-rotate(180deg);
    }

    #page-indicator {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0.8;
      z-index: 90;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header>
    <h3 style="margin:0;">📚 My PDF Books</h3>
    <button class="btn btn-secondary" id="toggle-dark">🌙</button>
  </header>

  <!-- LIBRARY VIEW -->
  <div id="library-view">
    <div class="upload-box">
      <p style="margin-top:0;">Add a PDF book from Files</p>
      <input type="file" id="file-input" accept="application/pdf" style="display:none;">
      <button class="btn" onclick="document.getElementById('file-input').click()">Upload PDF</button>
    </div>

    <div class="book-grid" id="book-grid"></div>
  </div>

  <!-- READER VIEW -->
  <div id="reader-view">
    <div id="reader-toolbar">
      <button class="btn btn-secondary" id="back-to-lib">← Library</button>
      <span style="font-size: 14px;"><span id="page-num">1</span> / <span id="page-count">?</span></span>
      <button class="btn btn-secondary" id="fit-width">📱 Fit</button>
    </div>

    <div id="canvas-container">
      <canvas id="pdf-canvas"></canvas>
    </div>

    <div id="page-indicator">Swipe or tap sides to flip</div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const DB_NAME = 'MobilePdfReaderDB';
    const STORE_NAME = 'books';
    
    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveBookToDB(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      
      const book = {
        id: 'book_' + Date.now(),
        title: file.name.replace('.pdf', ''),
        data: arrayBuffer,
        totalPages: pdf.numPages,
        lastPage: 1
      };

      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(book);
      tx.oncomplete = () => loadLibrary();
    }

    async function updatePageProgress(bookId, pageNum) {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const book = await new Promise(res => store.get(bookId).onsuccess = e => res(e.target.result));
      if (book) {
        book.lastPage = pageNum;
        store.put(book);
      }
    }

    async function deleteBook(bookId) {
      if (confirm('Delete this book?')) {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(bookId);
        tx.oncomplete = () => loadLibrary();
      }
    }

    async function loadLibrary() {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readonly');
      const books = await new Promise(res => tx.objectStore(STORE_NAME).getAll().onsuccess = e => res(e.target.result));
      
      const grid = document.getElementById('book-grid');
      grid.innerHTML = books.length ? '' : '<p style="text-align:center; opacity:0.6;">No books uploaded yet.</p>';

      books.forEach(book => {
        const progress = Math.round((book.lastPage / book.totalPages) * 100);
        const card = document.createElement('div');
        card.className = 'book-card';
        card.innerHTML = `
          <div class="book-info">
            <div class="book-title">${book.title}</div>
            <div class="book-meta">Page ${book.lastPage} of ${book.totalPages} (${progress}%)</div>
          </div>
          <div class="card-actions">
            <button class="btn" onclick="openReader('${book.id}')">Read</button>
            <button class="btn btn-danger" onclick="deleteBook('${book.id}')">✕</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    let currentBook = null;
    let pdfDoc = null;
    let pageNum = 1;
    let scale = 1.0;
    let pageRendering = false;
    let pageNumPending = null;

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');

    async function openReader(bookId) {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readonly');
      currentBook = await new Promise(res => tx.objectStore(STORE_NAME).get(bookId).onsuccess = e => res(e.target.result));

      document.getElementById('library-view').style.display = 'none';
      document.querySelector('header').style.display = 'none';
      document.getElementById('reader-view').style.display = 'flex';
      document.getElementById('page-count').textContent = currentBook.totalPages;

      pdfDoc = await pdfjsLib.getDocument({ data: currentBook.data }).promise;
      pageNum = currentBook.lastPage || 1;
      renderPage(pageNum);
    }

    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then(page => {
        const unscaledViewport = page.getViewport({ scale: 1.0 });
        const screenWidth = window.innerWidth;
        scale = screenWidth / unscaledViewport.width;

        const viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = { canvasContext: ctx, viewport: viewport };
        const renderTask = page.render(renderContext);

        renderTask.promise.then(() => {
          pageRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });

      document.getElementById('page-num').textContent = num;
      updatePageProgress(currentBook.id, num);
    }

    function queueRenderPage(num) {
      if (pageRendering) pageNumPending = num;
      else renderPage(num);
    }

    function nextPage() {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    }

    function prevPage() {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    }

    // Touch Controls
    let touchStartX = 0;
    let touchStartY = 0;

    const container = document.getElementById('canvas-container');

    container.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
    }, { passive: true });

    container.addEventListener('touchend', e => {
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;

      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX < 0) nextPage();
        else prevPage();
      } else if (Math.abs(diffX) < 10 && Math.abs(diffY) < 10) {
        const screenWidth = window.innerWidth;
        if (touchEndX < screenWidth * 0.3) {
          prevPage();
        } else if (touchEndX > screenWidth * 0.7) {
          nextPage();
        } else {
          document.getElementById('reader-toolbar').classList.toggle('hidden');
        }
      }
    }, { passive: true });

    window.addEventListener('resize', () => {
      if (pdfDoc && document.getElementById('reader-view').style.display === 'flex') {
        renderPage(pageNum);
      }
    });

    document.getElementById('back-to-lib').onclick = () => {
      document.getElementById('reader-view').style.display = 'none';
      document.querySelector('header').style.display = 'flex';
      document.getElementById('library-view').style.display = 'block';
      loadLibrary();
    };

    document.getElementById('fit-width').onclick = () => renderPage(pageNum);

    document.getElementById('file-input').onchange = e => {
      const file = e.target.files[0];
      if (file && file.type === 'application/pdf') saveBookToDB(file);
    };

    const darkToggleBtn = document.getElementById('toggle-dark');
    darkToggleBtn.onclick = () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      darkToggleBtn.textContent = isDark ? '☀️' : '🌙';
    };

    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
      darkToggleBtn.textContent = '☀️';
    }

    loadLibrary();

    // Register Service Worker for Offline Functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Registered'))
          .catch(err => console.error('Service Worker Registration Failed:', err));
      });
    }
  </script>
</body>
</html>
